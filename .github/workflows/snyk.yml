name: Snyk

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master
  schedule:
    - cron: "0 16 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  open-source:
    name: Open Source and Container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    steps:
      - name: Require Snyk Token
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "::error::SNYK_TOKEN is required. Configure it in Actions and Dependabot secrets."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 24.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scan dependencies
        uses: snyk/actions/node@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        with:
          args: >-
            --file=package.json
            --package-manager=npm
            --severity-threshold=high

      - name: Build production image
        run: docker build --target production --tag docker-node-app:snyk .

      - name: Scan production image
        run: |
          # snyk/actions/docker invokes the legacy `snyk test --docker` path.
          # Use Snyk's current container command with the current immutable
          # scanner runtime so scanner updates cannot silently change CI.
          docker run --rm \
            --env SNYK_TOKEN \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            snyk/snyk@sha256:3c6fbd3e70dea2792d6bc2a080335fafdccd243ad9c0b7faa91002caac7d7851 \
            snyk container test docker-node-app:snyk \
              --exclude-app-vulns \
              --file=Dockerfile \
              --severity-threshold=high
