name: Publish

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [develop, master]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event_name == 'workflow_dispatch' && github.ref_name || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Release Checks
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      checks: read
      contents: read
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      branch: ${{ steps.release.outputs.branch }}
    steps:
      - name: Verify Exact Release Commit
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
          RELEASE_BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || github.event.workflow_run.head_branch }}
          MANUAL_RELEASE: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          case "$RELEASE_BRANCH" in
            develop|master) ;;
            *) echo "Unsupported release branch: $RELEASE_BRANCH" >&2; exit 1 ;;
          esac
          current_sha="$(gh api "repos/$GH_REPO/commits/$RELEASE_BRANCH" --jq .sha)"
          if [ "$current_sha" != "$RELEASE_SHA" ]; then
            echo "Release commit is no longer the branch head." >&2
            exit 1
          fi

          # Manual releases rerun all checks, including the current vulnerability data.
          check_after="$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
          if [ "$MANUAL_RELEASE" = true ]; then
            check_after="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            for workflow in ci.yaml snyk.yml codeql.yml; do
              gh workflow run "$workflow" --ref "$RELEASE_BRANCH"
            done
          fi

          if [ "$RELEASE_BRANCH" = master ]; then
            required='["Test (Node 26)","Lint and audit","Helm lint and render","Build container","Open Source and Container","Analyze JavaScript"]'
          else
            required='["Test (Node 22)","Test (Node 24)","Lint and audit","Helm lint and render","Build container","Open Source","Analyze JavaScript"]'
          fi

          for attempt in {1..60}; do
            checks="$(gh api --paginate --slurp "repos/$GH_REPO/commits/$RELEASE_SHA/check-runs?per_page=100")"
            missing="$(jq -r --argjson required "$required" --arg after "$check_after" '
              [.[].check_runs[] | select(.app.slug == "github-actions")] as $runs
              | $required[] as $name
              | ([$runs[] | select(.name == $name)] | max_by(.id)) as $latest
              | select($latest == null or $latest.status != "completed"
                  or $latest.conclusion != "success" or $latest.started_at < $after)
              | $name
            ' <<< "$checks")"
            if [ -z "$missing" ]; then
              current_sha="$(gh api "repos/$GH_REPO/commits/$RELEASE_BRANCH" --jq .sha)"
              if [ "$current_sha" != "$RELEASE_SHA" ]; then
                echo "Branch advanced while checks were running; release blocked." >&2
                exit 1
              fi
              echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
              echo "branch=$RELEASE_BRANCH" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Waiting for successful checks on $RELEASE_SHA: $missing"
            sleep 10
          done
          echo "Release blocked by missing, stale, skipped, or failed checks: $missing" >&2
          exit 1

  container:
    name: Publish container
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}
      - name: Read package version
        id: package
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: jonfairbanks/docker-node-app
          tags: |
            type=sha
            type=raw,value=develop,enable=${{ needs.verify.outputs.branch == 'develop' }}
            type=raw,value=latest,enable=${{ needs.verify.outputs.branch == 'master' }}
            type=raw,value=${{ steps.package.outputs.version }},enable=${{ needs.verify.outputs.branch == 'master' }}
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm:
    name: Publish Helm chart
    needs: verify
    if: needs.verify.outputs.branch == 'master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          fetch-depth: 2
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3
      - name: Publish chart to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(awk '/^version:/ { print $2; exit }' chart/Chart.yaml)
          chart=oci://ghcr.io/jonfairbanks/charts/docker-node-app
          if helm show chart "$chart" --version "$version" >/dev/null 2>&1; then
            if git diff --quiet HEAD^ HEAD -- chart; then
              echo "${chart}:${version} already exists and this change does not modify the chart."
              exit 0
            fi
            echo "${chart}:${version} already exists; increment chart/Chart.yaml." >&2
            exit 1
          fi
          echo "$GHCR_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm package chart --destination /tmp/charts
          helm push "/tmp/charts/docker-node-app-${version}.tgz" oci://ghcr.io/jonfairbanks/charts
